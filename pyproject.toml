[project]
name = "agritrace"
version = "0.1.0"
description = "Fictional agrifood traceability knowledge graph with GraphRAG, LangGraph agents, MCP, and governance controls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "El Bachir Mourabit" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langgraph>=0.2.60",
    "mcp>=1.2",
    "neo4j>=5.26",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "pydantic>=2.6",
    "rdflib>=7.1",
    "streamlit>=1.40",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
obs = [
    "langsmith>=0.1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
agritrace-api = "agritrace.api.main:main"
agritrace-demo = "agritrace.demo:main"
agritrace-eval = "agritrace.eval.runner:main"
agritrace-mcp = "agritrace.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agritrace = ["py.typed", "data/schema.sql", "eval/dataset.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["agritrace"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "neo4j.*",
    "mcp.*",
    "langgraph.*",
    "langchain_core.*",
    "opentelemetry.*",
    "streamlit.*",
    "fastapi.*",
    "httpx.*",
    "uvicorn.*",
]
ignore_missing_imports = true
