name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
      GRAPH_BACKEND: memory
      AGRITRACE_AS_OF: "2026-11-13"
      OTEL_EXPORTER: none
      AGRITRACE_DEMO_OPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests ui
          ruff format --check src tests ui
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest
      - name: Eval
        run: python -m agritrace.eval.runner
